<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="NutriApp — Tableau de bord de surveillance nutritionnelle clinique, communautaire et maladies chroniques (MNT) pour le Ministère de la Santé, Afrique de l'Ouest." />
<meta name="theme-color" content="#1E0A3C" />
<title>NutriApp · Surveillance Nutritionnelle Clinique, Communautaire &amp; MNT — Ministère de la Santé</title>

<!-- ══════════════════════════════════════════════════════════════════════
     NutriApp · Dashboard de Surveillance Nutritionnelle (Min. Santé)
     ──────────────────────────────────────────────────────────────────────
     ✅ HTML + CSS + JavaScript PUR — ZÉRO framework (pas de Chart.js / D3)
     ✅ Fichier unique autonome (index.html)
     ✅ TOUS les graphiques sont rendus avec l'API Canvas 2D native
     ✅ Données de télémétrie NutriApp (16 pays d'Afrique de l'Ouest) :
        saisies agents communautaires, cliniques mobiles, dépistages PB/MUAC,
        enquêtes ménages et inventaires ATPE.
     ========================================================================== -->

<!-- Typographie officielle du design-system : Inter (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

<!-- Favicon SVG inline : croix médicale + caducée violet -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M26 12h12v14h14v12H38v14H26V38H12V26h14z' fill='white'/%3E%3C/svg%3E" />

<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. JETONS DE DESIGN — IDENTITÉ VISUELLE MINISTÈRE DE LA SANTÉ
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Palette exclusive NutriApp / Min. Santé */
  --primary:#7C3AED;        /* violet médical          */
  --primary-2:#A855F7;      /* violet clair (gradient) */
  --primary-deep:#5B21B6;
  --secondary:#06B6D4;      /* cyan clinique           */
  --tertiary:#10B981;       /* vert santé              */
  --quaternary:#F59E0B;     /* ambre avertissement     */
  --danger:#EF4444;         /* rouge urgence           */

  --sidebar-1:#1E0A3C;      /* dégradé sidebar (haut)  */
  --sidebar-2:#11052C;      /* dégradé sidebar (bas)   */
  --sidebar-border:#2D1254; /* bordure lumineuse       */

  --bg:#FAF5FF;             /* fond global violet TBC  */
  --card:#FFFFFF;
  --card-border:#DDD6FE;

  /* Encres & hiérarchie typographique */
  --ink:#0F172A;            /* titre dashboard 28/700  */
  --ink-2:#1E293B;          /* titre card 16/600       */
  --ink-3:#334155;          /* valeurs data 13/600     */
  --muted:#64748B;
  --muted-2:#94A3B8;        /* sous-titre card 13/400  */

  /* Géométrie */
  --sidebar-w:260px;
  --header-h:72px;
  --radius:20px;
  --radius-sm:12px;
  --pad:28px;

  /* Ombres sophistiquées (halo violet) */
  --shadow-card:0 4px 6px -1px rgba(124,58,237,.05), 0 10px 25px -5px rgba(124,58,237,.08);
  --shadow-card-hover:0 12px 20px -6px rgba(124,58,237,.12), 0 28px 55px -12px rgba(124,58,237,.22);
  --shadow-pop:0 18px 45px -12px rgba(15,23,42,.35), 0 4px 12px -2px rgba(15,23,42,.18);

  /* Courbes d'animation */
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ═══════════════════════════════════════════════════════════════════════
   2. RESET & BASE
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background-color:var(--bg);
  /* Subtil pattern de grille technique (papier millimétré violet) */
  background-image:
    linear-gradient(rgba(124,58,237,.040) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,58,237,.040) 1px, transparent 1px),
    radial-gradient(circle at 88% -8%, rgba(168,85,247,.10), transparent 45%),
    radial-gradient(circle at 4% 104%, rgba(6,182,212,.08), transparent 42%);
  background-size:32px 32px, 32px 32px, 100% 100%, 100% 100%;
  background-attachment:fixed;
  color:var(--ink-3);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
/* Barres de défilement discrètes, aux couleurs du thème */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(124,58,237,.04)}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.28);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(124,58,237,.5);background-clip:padding-box}
::selection{background:rgba(124,58,237,.20);color:var(--ink)}
button,select,input{font-family:inherit}

/* Mode plein écran immersif « investisseur » : on densifie légèrement */
body.is-fullscreen{--pad:32px}
body.is-fullscreen .main{padding:26px 34px 40px}
body.is-fullscreen .dash-title{font-size:31px}

/* ═══════════════════════════════════════════════════════════════════════
   3. STRUCTURE GLOBALE (sidebar fixe + header collant + contenu fluide)
   ═══════════════════════════════════════════════════════════════════════ */
.app{display:block;min-height:100vh}

/* ── 3.1 Sidebar de navigation fixe (260px) ─────────────────────────── */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:90;
  background:linear-gradient(168deg,var(--sidebar-1) 0%, #170733 48%, var(--sidebar-2) 100%);
  border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;
  box-shadow:14px 0 44px -22px rgba(17,5,44,.85);
  overflow:hidden;
}
/* Liseré lumineux vertical + halos décoratifs */
.sidebar::after{
  content:"";position:absolute;top:0;right:0;width:1px;height:100%;
  background:linear-gradient(180deg,transparent,rgba(168,85,247,.75),rgba(6,182,212,.45),transparent);
}
.sidebar::before{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.34),transparent 62%);
  top:-120px;left:-130px;pointer-events:none;
}
.sb-halo{position:absolute;width:300px;height:300px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(6,182,212,.20),transparent 65%);bottom:-110px;right:-120px}

.sb-brand{position:relative;display:flex;gap:12px;align-items:center;padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(140deg,#7C3AED,#A855F7 55%,#06B6D4);
  box-shadow:0 8px 22px -6px rgba(124,58,237,.85), inset 0 1px 0 rgba(255,255,255,.35)}
.brand-mark svg{width:27px;height:27px;display:block}
.brand-txt h1{margin:0;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.15}
.brand-txt p{margin:3px 0 0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:#C4B5FD}

.sb-scroll{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px 8px;scrollbar-width:thin}
.sb-scroll::-webkit-scrollbar{width:6px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(196,181,253,.25);border:0}
.sb-label{padding:12px 10px 8px;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7C6AA8}

.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;margin-bottom:3px;border:0;border-radius:13px;cursor:pointer;
  background:transparent;color:#C9C2E6;font-size:13px;font-weight:600;text-align:left;
  transition:background .22s var(--ease), color .22s var(--ease), transform .22s var(--ease);
}
.nav-item .ico{font-size:15px;width:22px;text-align:center;flex:0 0 22px;filter:saturate(.9)}
.nav-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.08);color:#B8AEE0;letter-spacing:.02em}
.nav-item:hover{background:rgba(255,255,255,.055);color:#fff;transform:translateX(2px)}
.nav-item.active{background:linear-gradient(100deg,rgba(124,58,237,.42),rgba(124,58,237,.12));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.24)}
.nav-item.active .cnt{background:rgba(255,255,255,.16);color:#fff}
/* Barre d'indication active */
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#A855F7,#06B6D4);
  box-shadow:0 0 14px rgba(168,85,247,.9)}

/* Encart « connexion terrain » en bas de sidebar */
.sb-card{position:relative;margin:10px 12px 12px;padding:14px;border-radius:16px;
  background:linear-gradient(150deg,rgba(124,58,237,.30),rgba(6,182,212,.12));
  border:1px solid rgba(196,181,253,.22)}
.sb-card h4{margin:0 0 4px;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.01em}
.sb-card p{margin:0 0 10px;font-size:10.5px;line-height:1.45;color:#CBBFF2}
.sb-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.sb-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#06B6D4,#A855F7);
  box-shadow:0 0 12px rgba(6,182,212,.7)}
.sb-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:9.5px;font-weight:600;color:#A99BD6}
.sb-foot{position:relative;padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:9.5px;color:#7C6AA8;line-height:1.6}
.sb-foot b{color:#A99BD6;font-weight:700}

/* ── 3.2 Zone principale (fluide, à droite de la sidebar) ───────────── */
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}

/* ── 3.3 Header persistant 72px — glassmorphism ─────────────────────── */
.topbar{
  position:sticky;top:0;z-index:80;height:var(--header-h);
  display:flex;align-items:center;gap:16px;padding:0 28px;
  background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--card-border);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 8px 26px -18px rgba(124,58,237,.45);
}
.tb-left{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
/* Fil d'ariane interactif dynamique */
.crumb{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--muted-2);flex-wrap:wrap}
.crumb a{color:var(--muted-2);text-decoration:none;cursor:pointer;border-radius:6px;padding:1px 4px;margin-left:-4px;
  transition:color .18s,background .18s}
.crumb a:hover{color:var(--primary);background:rgba(124,58,237,.08)}
.crumb .sep{opacity:.55;font-size:10px}
.crumb .here{color:var(--primary-deep);font-weight:700}
.dash-title{margin:0;font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.7px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* Sélecteur segmenté : périmètre (Vue globale / Vue par pays) */
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:rgba(124,58,237,.07);
  border:1px solid var(--card-border)}
.seg-btn{display:flex;align-items:center;gap:7px;padding:7px 13px;border:0;border-radius:11px;cursor:pointer;
  background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;
  transition:all .24s var(--ease)}
.seg-btn:hover{color:var(--primary-deep)}
.seg-btn.on{background:#fff;color:var(--primary-deep);font-weight:700;
  box-shadow:0 2px 6px -1px rgba(124,58,237,.22), 0 0 0 1px rgba(124,58,237,.10)}
.seg-btn .car{font-size:13px}

/* Sélecteur de pays contextuel (visible uniquement en mode « pays ») */
.country-picker{position:relative;display:none}
.country-picker.show{display:block;animation:fadeSlide .34s var(--ease) both}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:none}}
.cp-btn{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 9px;border-radius:14px;cursor:pointer;
  background:#fff;border:1px solid var(--card-border);box-shadow:0 2px 8px -4px rgba(124,58,237,.35);
  transition:all .2s var(--ease)}
.cp-btn:hover{border-color:#C4B5FD;box-shadow:0 6px 16px -6px rgba(124,58,237,.45)}
.cp-flag{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(140deg,rgba(124,58,237,.16),rgba(6,182,212,.16));border:1px solid rgba(124,58,237,.16)}
.cp-name{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.1}
.cp-sub{font-size:9.5px;font-weight:600;color:var(--muted-2);letter-spacing:.02em}
.cp-caret{color:var(--muted-2);font-size:9px;transition:transform .25s var(--ease)}
.cp-btn[aria-expanded="true"] .cp-caret{transform:rotate(180deg)}
.cp-menu{position:absolute;top:calc(100% + 9px);right:0;width:340px;max-height:70vh;overflow:auto;z-index:120;
  background:#fff;border:1px solid var(--card-border);border-radius:18px;padding:10px;
  box-shadow:var(--shadow-pop);display:none}
.cp-menu.open{display:block;animation:fadeSlide .22s var(--ease) both}
.cp-search{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--card-border);
  background:#FAF5FF;font-size:12.5px;color:var(--ink-2);outline:none;margin-bottom:8px}
.cp-search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
.cp-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:0;border-radius:12px;
  background:transparent;cursor:pointer;text-align:left;transition:background .16s}
.cp-opt:hover{background:rgba(124,58,237,.07)}
.cp-opt.sel{background:linear-gradient(100deg,rgba(124,58,237,.14),rgba(6,182,212,.07));
  box-shadow:inset 0 0 0 1px rgba(124,58,237,.20)}
.cp-opt .f{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;
  background:rgba(124,58,237,.09);flex:0 0 26px}
.cp-opt .n{flex:1;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.cp-opt .m{font-size:10px;font-weight:700;color:var(--muted-2)}
.cp-opt.sel .n{color:var(--primary-deep);font-weight:700}

/* Badge animé « Synchro NutriApp LIVE » */
.live{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 11px;border-radius:99px;
  background:linear-gradient(100deg,rgba(16,185,129,.13),rgba(6,182,212,.10));
  border:1px solid rgba(16,185,129,.34);font-size:11.5px;font-weight:700;color:#047857;white-space:nowrap}
.live .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--tertiary);flex:0 0 8px}
.live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(16,185,129,.55);
  animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.95}80%,100%{transform:scale(1.5);opacity:0}}
.live small{font-weight:600;color:#0E9F6E;opacity:.85;font-variant-numeric:tabular-nums}

/* Boutons icônes du header (plein écran natif + export) */
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;cursor:pointer;
  background:#fff;border:1px solid var(--card-border);color:var(--primary-deep);
  box-shadow:0 2px 8px -4px rgba(124,58,237,.30);transition:all .2s var(--ease)}
.icon-btn:hover{transform:translateY(-1px);border-color:#C4B5FD;box-shadow:0 8px 18px -8px rgba(124,58,237,.6)}
.icon-btn:active{transform:translateY(0)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .i-exit{display:none}
body.is-fullscreen .icon-btn .i-enter{display:none}
body.is-fullscreen .icon-btn .i-exit{display:block}
.vr{width:1px;height:30px;background:var(--card-border);flex:0 0 1px}

/* ── 3.4 Contenu ────────────────────────────────────────────────────── */
.content{flex:1;padding:22px 28px 44px;max-width:1920px;width:100%}

/* Bandeau de contexte du périmètre (région ou pays) */
.scope-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 20px;padding:14px 18px;
  background:linear-gradient(100deg,rgba(255,255,255,.94),rgba(250,245,255,.86));
  border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.scope-ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:0 0 42px;
  background:linear-gradient(140deg,var(--primary),var(--primary-2));color:#fff;
  box-shadow:0 8px 20px -8px rgba(124,58,237,.9)}
.scope-txt h3{margin:0;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.scope-txt p{margin:2px 0 0;font-size:11.5px;color:var(--muted-2);font-weight:500}
.scope-chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:11px;font-weight:700;
  background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.16);color:var(--primary-deep);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink)}
.chip.cyan{background:rgba(6,182,212,.09);border-color:rgba(6,182,212,.24);color:#0E7490}
.chip.green{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.26);color:#047857}
.chip.amber{background:rgba(245,158,11,.11);border-color:rgba(245,158,11,.28);color:#B45309}
.chip.red{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.26);color:#B91C1C}

/* Sections pilotées par la sidebar */
.view{display:none}
.view.active{display:block;animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-head{margin:34px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
.sec-head h2{margin:0;font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:-.2px}
.sec-head span{font-size:11.5px;color:var(--muted-2);font-weight:500}
.sec-head .rule{flex:1;height:1px;min-width:30px;
  background:linear-gradient(90deg,var(--card-border),transparent)}

/* ═══════════════════════════════════════════════════════════════════════
   4. GRILLE CSS RESPONSIVE DES CARTES
   ═══════════════════════════════════════════════════════════════════════ */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;align-items:start}
.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.span-2{grid-column:span 2}

/* ── 4.1 Carte générique ────────────────────────────────────────────── */
.card{
  position:relative;background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow-card);
  transition:box-shadow .35s var(--ease), transform .35s var(--ease);
  overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-card-hover)}
/* Liseré supérieur discret */
.card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.55),transparent)}
.card-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.card-head .txt{min-width:0;flex:1}
.card-title{margin:0;font-size:16px;font-weight:600;color:var(--ink-2);letter-spacing:-.25px;line-height:1.3}
.card-sub{margin:5px 0 0;font-size:13px;font-weight:400;color:var(--muted-2);line-height:1.45}
.card-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:10px;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;
  background:rgba(124,58,237,.08);color:var(--primary-deep);border:1px solid rgba(124,58,237,.16)}
.tag.cyan{background:rgba(6,182,212,.10);color:#0E7490;border-color:rgba(6,182,212,.24)}
.tag.green{background:rgba(16,185,129,.11);color:#047857;border-color:rgba(16,185,129,.26)}
.tag.amber{background:rgba(245,158,11,.12);color:#B45309;border-color:rgba(245,158,11,.28)}
.tag.red{background:rgba(239,68,68,.10);color:#B91C1C;border-color:rgba(239,68,68,.26)}
.tag.grey{background:rgba(100,116,139,.10);color:var(--muted);border-color:rgba(100,116,139,.20)}

/* Conteneur canvas : le canvas est en position absolue pour éviter tout
   saut de mise en page lors des redimensionnements (DPR compris). */
.chart{position:relative;width:100%}
.chart canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart canvas:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:10px}
.h-250{height:250px}.h-280{height:280px}.h-300{height:300px}.h-320{height:320px}
.h-340{height:340px}.h-360{height:360px}.h-380{height:380px}.h-420{height:420px}

/* Légende & pied de carte (HTML, donc parfaitement accessibles) */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:14px;
  border-top:1px dashed rgba(124,58,237,.20)}
.legend-i{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted)}
.legend-i i{width:11px;height:11px;border-radius:4px;flex:0 0 11px;display:block}
.legend-i.line i{height:3px;border-radius:99px;width:16px;flex-basis:16px}
.legend-i.dash i{height:0;border-top:2px dashed currentColor;border-radius:0;width:16px;flex-basis:16px;background:none!important}
#legendBurden:empty{display:none}
.card-foot{margin-top:14px;font-size:11px;color:var(--muted-2);display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.card-foot .src{font-weight:700;color:var(--muted);white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════════════
   5. KPI CARDS (5 indicateurs adaptatifs région / pays)
   ═══════════════════════════════════════════════════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-bottom:20px}
.kpi{
  position:relative;overflow:hidden;background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:20px 22px 18px;box-shadow:var(--shadow-card);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}
/* Halo coloré propre à chaque KPI + barre d'accent */
.kpi::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--accent),transparent 78%)}
.kpi::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-72px;top:-88px;
  background:radial-gradient(circle,var(--accent-soft),transparent 66%);pointer-events:none}
/* Sparkline de fond du KPI (canvas) */
.kpi .bg-spark{position:absolute;left:0;right:0;bottom:0;height:74px;width:100%;opacity:.5;pointer-events:none}
.kpi-top{position:relative;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.kpi-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:0 0 34px;
  background:var(--accent-soft);border:1px solid var(--accent-line)}
.kpi-label{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);
  line-height:1.35;padding-top:3px}
.kpi-val{position:relative;display:flex;align-items:baseline;gap:5px;margin-bottom:7px}
.kpi-num{font-size:38px;font-weight:800;letter-spacing:-1.6px;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;text-shadow:0 2px 14px var(--accent-soft)}
.kpi-unit{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:-.2px}
.kpi-sub{position:relative;font-size:11.5px;font-weight:400;color:var(--muted-2);line-height:1.45;
  margin-bottom:13px;min-height:33px}
/* Badge d'état du KPI (évolution, alerte, réseau…) */
.kpi-badge{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;
  font-size:11px;font-weight:700;line-height:1.25;background:var(--accent-soft);color:var(--accent-deep);
  border:1px solid var(--accent-line);max-width:100%;flex-wrap:wrap}
.kpi-badge > span{min-width:0;overflow-wrap:anywhere}
.kpi-badge .up{font-size:10px}
.kpi-badge.pulse{animation:pulseRed 1.9s ease-in-out infinite}
@keyframes pulseRed{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.42);background:rgba(239,68,68,.10)}
  50%{box-shadow:0 0 0 7px rgba(239,68,68,0);background:rgba(239,68,68,.19)}
}
.kpi-badge canvas{width:52px;height:16px;flex:0 0 52px;opacity:.9;display:block}
.kpi-delta{position:relative;margin-top:9px;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--muted-2)}
.kpi-delta b{color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════════════════════════════
   6. SCORECARD — TABLEAU SYNTHÉTIQUE DES UNITÉS NUTRIAPP (graphique 15)
   ═══════════════════════════════════════════════════════════════════════ */
.tbl-wrap{position:relative;overflow:auto;max-height:min(660px,68vh);border-radius:16px;
  border:1px solid var(--card-border);overscroll-behavior:contain}
table.score{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1180px}
table.score thead th{
  position:sticky;top:0;z-index:2;background:#FAF5FF;padding:12px 14px;text-align:right;white-space:nowrap;
  font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);
  border-bottom:1px solid var(--card-border);cursor:pointer;user-select:none;transition:color .18s,background .18s}
table.score thead th:hover{color:var(--primary-deep);background:#F3EBFF}
table.score thead th:first-child{text-align:left;border-radius:16px 0 0 0}
table.score thead th:last-child{border-radius:0 16px 0 0;cursor:default}
table.score thead th .ar{opacity:0;margin-left:5px;font-size:9px;transition:opacity .18s}
table.score thead th.sorted{color:var(--primary-deep)}
table.score thead th.sorted .ar{opacity:1}
table.score tbody td{padding:11px 14px;text-align:right;font-weight:600;color:var(--ink-3);
  border-bottom:1px solid rgba(221,214,254,.55);font-variant-numeric:tabular-nums;white-space:nowrap}
table.score tbody td:first-child{text-align:left}
table.score tbody tr{transition:background .18s}
table.score tbody tr:hover{background:rgba(124,58,237,.045)}
table.score tbody tr:hover .zone-n{color:var(--primary-deep)}
table.score tbody tr:last-child td{border-bottom:0}
.zone-c{display:flex;align-items:center;gap:11px}
.zone-f{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex:0 0 30px;
  background:linear-gradient(140deg,rgba(124,58,237,.13),rgba(6,182,212,.13));border:1px solid rgba(124,58,237,.14)}
.zone-n{font-size:13px;font-weight:700;color:var(--ink-2);transition:color .18s;line-height:1.2}
.zone-m{font-size:10px;font-weight:600;color:var(--muted-2);letter-spacing:.02em}
.spark-cell{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.spark-cell canvas{width:76px;height:26px;flex:0 0 76px;border-radius:5px}
.delta{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:7px;font-variant-numeric:tabular-nums}
.delta.up{background:rgba(16,185,129,.13);color:#047857}
.delta.down{background:rgba(239,68,68,.12);color:#B91C1C}
.delta.flat{background:rgba(100,116,139,.12);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;
  border:1px solid transparent;white-space:nowrap;transition:transform .18s var(--ease)}
.pill:hover{transform:scale(1.05)}
.pill i{width:7px;height:7px;border-radius:50%;display:block}
.pill.ok{background:rgba(16,185,129,.11);color:#047857;border-color:rgba(16,185,129,.30)}
.pill.ok i{background:var(--tertiary)}
.pill.warn{background:rgba(245,158,11,.13);color:#B45309;border-color:rgba(245,158,11,.32)}
.pill.warn i{background:var(--quaternary)}
.pill.crit{background:rgba(239,68,68,.11);color:#B91C1C;border-color:rgba(239,68,68,.30)}
.pill.crit i{background:var(--danger);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
.mini-bar{position:relative;width:74px;height:7px;border-radius:99px;background:rgba(124,58,237,.12);overflow:hidden;
  display:inline-block;vertical-align:middle;margin-right:9px}
.mini-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .8s var(--ease)}
.tbl-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:11px;color:var(--muted-2)}

/* ═══════════════════════════════════════════════════════════════════════
   7. TOOLTIP NATIF CANVAS — carte blanche flottante, bordure gauche 4px
   ═══════════════════════════════════════════════════════════════════════ */
.tip{
  position:fixed;z-index:200;min-width:186px;max-width:308px;padding:12px 14px 11px;
  background:#fff;border-radius:14px;border:1px solid rgba(221,214,255,.9);
  border-left:4px solid var(--tc,#7C3AED);
  box-shadow:0 22px 48px -14px rgba(15,23,42,.42), 0 6px 16px -6px rgba(124,58,237,.30);
  pointer-events:none;opacity:0;transform:translateY(7px) scale(.97);
  transition:opacity .16s var(--ease), transform .16s var(--ease)}
.tip.show{opacity:1;transform:none}
.tip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;
  border-bottom:1px dashed rgba(148,163,184,.35)}
.tip-t{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:-.15px;line-height:1.25}
.tip-s{font-size:10px;font-weight:600;color:var(--muted-2);margin-left:auto;white-space:nowrap}
.tip-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2.5px 0}
.tip-row i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.tip-row .k{color:var(--muted);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip-row .v{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tip-row .d{font-size:10px;font-weight:800;padding:1px 5px;border-radius:6px}
.tip-row .d.up{background:rgba(16,185,129,.14);color:#047857}
.tip-row .d.down{background:rgba(239,68,68,.13);color:#B91C1C}
.tip-row .d.flat{background:rgba(100,116,139,.13);color:var(--muted)}
.tip-note{margin-top:8px;padding-top:7px;border-top:1px dashed rgba(148,163,184,.35);font-size:10px;
  color:var(--muted-2);line-height:1.45}

/* ═══════════════════════════════════════════════════════════════════════
   8. DIVERS : notes, pied de page, utilitaires
   ═══════════════════════════════════════════════════════════════════════ */
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:16px;margin-top:20px;
  background:linear-gradient(100deg,rgba(124,58,237,.06),rgba(6,182,212,.05));
  border:1px solid rgba(124,58,237,.16);font-size:11.5px;color:var(--muted);line-height:1.6}
.note .ni{font-size:15px;line-height:1}
.note b{color:var(--ink-2);font-weight:700}
.page-foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--card-border);
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted-2)}
.page-foot b{color:var(--muted);font-weight:700}
.page-foot .dotsep{opacity:.5}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════════════
   9. RESPONSIVE — Tablette (≤1180px) puis mobile (≤760px)
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width:1500px){
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4),.kpi:nth-child(5){grid-column:span 1}
}

  :root{--sidebar-w:78px;--pad:22px}

  .sidebar .sb-label,.sidebar .sb-card,.sidebar .sb-foot{display:none}
  .sb-brand{justify-content:center;padding:18px 0}
  .nav-item{justify-content:center;padding:12px 0}
  .nav-item .ico{width:auto;flex:none;font-size:18px}
  .nav-item.active::before{left:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-6,.span-4,.span-3,.span-2{grid-column:span 2}

  .dash-title{font-size:22px}
  .content{padding:18px 18px 40px}
  .topbar{padding:0 18px;gap:10px}
  .live small{display:none}
}
@media (max-width:900px){
  .seg-btn .lbl{display:none}

}
@media (max-width:760px){

    border-right:0;border-bottom:1px solid var(--sidebar-border)}
  .sidebar::after{display:none}
  .sb-brand{border:0;padding:0 12px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
